[workspace]
members = [
    "crates/gitquarry-wire",
    "crates/gitquarry-gpg",
    "crates/gitquarry-i18n",
    "crates/gitquarry-auth-crypto",
    "crates/gitquarry-core",
    "crates/gitquarry-domain",
    "crates/gitquarry-webui",
    "crates/gitquarry-server",
]
# No root [package]: this manifest is workspace-only. `cargo build` from
# here builds every member; `cargo build -p gitquarry` builds just the
# shipped binary (package `gitquarry`, crate dir `gitquarry-server` — the
# one place that depends on both `gitquarry-core` and `gitquarry-webui`,
# see docs/webui-crate-split-concept.md). `gitquarry-core` itself is
# lib-only, no bin target.
resolver = "2"

# The one place the release number lives. Cargo can't read it from a file of
# its own -- manifests have no include -- so this table is the `.version`:
# every member inherits it with `version.workspace = true`, and a bump is a
# one-line change instead of eight that can silently disagree.
[workspace.package]
version = "0.2.0"
