[package]
name = "gitquarry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Git remote backed by S3: ssh:// and git-smart-HTTP servers plus a read-only web UI"
license.workspace = true

[dependencies]
# Path, not `workspace = true`, on these two: edition 2024 rejects
# `default-features = false` on an inherited dependency whose workspace entry
# keeps defaults, and this crate's own `tracker` feature is what turns their
# `tracker` features back on (see [features] below).
gitquarry-core = { path = "../gitquarry-core", default-features = false }
gitquarry-i18n = { workspace = true }
gitquarry-auth-crypto = { workspace = true }
gitquarry-domain = { workspace = true }
gitquarry-mirror-external = { workspace = true }
gitquarry-webui = { path = "../gitquarry-webui", default-features = false }

# dyn-dispatch for gitquarry_core::mirror::MirrorSyncHook (mirror_sync.rs)
async-trait = { workspace = true }

# Storage engine, direct dep only for the stale-transaction recovery sweep
# in serve.rs (`s3db::txn::recover_stale`).
s3db = { workspace = true, features = ["streaming"] }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "fs", "net", "signal", "sync", "time"] }

# The setup wizard's own tiny axum server (serve.rs hands off to normal
# startup once it succeeds).
axum = { workspace = true, features = ["multipart"] }

# Outbound HTTP for FederationLink's peer round-trip.
reqwest = { workspace = true }

serde = { workspace = true }
# Compares the setup wizard's one-time token (setup.rs) in constant time.
subtle = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = ["tracker"]
# Issue tracker/board/milestones tabs — see
# docs/tracker-binary-split-concept.md. `gitquarry-tracker` is its own
# binary, never a dependency of this one; this only toggles whether
# `webui`'s issues/board/milestones pages compile in at all. Off in a
# minimal build that never wants those tabs even if `[tracker]` were
# configured.
tracker = ["gitquarry-webui/tracker", "gitquarry-core/tracker"]

[dev-dependencies]
gitquarry-test-support = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
