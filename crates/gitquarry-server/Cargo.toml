[package]
name = "gitquarry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Git remote backed by S3: ssh:// and git-smart-HTTP servers plus a read-only web UI"
license.workspace = true

[dependencies]
gitquarry-core = { workspace = true }
gitquarry-i18n = { workspace = true }
gitquarry-auth-crypto = { workspace = true }
gitquarry-domain = { workspace = true }
gitquarry-mirror-external = { workspace = true }
gitquarry-webui = { path = "../gitquarry-webui" }

# dyn-dispatch for gitquarry_core::mirror::MirrorSyncHook (mirror_sync.rs)
async-trait = { workspace = true }

# Storage engine, direct dep only for the stale-transaction recovery sweep
# in serve.rs (`s3db::txn::recover_stale`).
s3db = { workspace = true, features = ["streaming"] }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "fs", "net", "signal", "sync", "time"] }

# The setup wizard's own tiny axum server (serve.rs hands off to normal
# startup once it succeeds).
axum = { workspace = true, features = ["multipart"] }

# Outbound HTTP for FederationLink's peer round-trip.
reqwest = { workspace = true }

serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
gitquarry-test-support = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
