[package]
name = "gitquarry-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared fixtures for the workspace's integration tests, built only on the crates' public APIs"
license.workspace = true
publish = false

[dependencies]
gitquarry-core = { path = "../gitquarry-core" }
gitquarry-federation = { path = "../gitquarry-federation" }
gitquarry-i18n = { path = "../gitquarry-i18n" }
s3db = { git = "https://git.yerasuu.com/yerasuu/s3db", tag = "v0.4.6" }
s3db-crypto = { git = "https://git.yerasuu.com/yerasuu/s3db", tag = "v0.4.6" }
axum = "0.8.9"
tower = { version = "0.5", features = ["util"] }
form_urlencoded = "1.2.2"
tokio = { version = "1.53.1", features = ["process"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
