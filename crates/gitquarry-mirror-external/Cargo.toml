[package]
name = "gitquarry-mirror-external"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "External-forge ref/MR mirror sync (GitHub/GitLab/Codeberg) -- a library, not its own process; gitquarry-server wires it into AppContext::mirror_sync at startup, since gitquarry-core can't depend on it directly (this crate depends on core)"
license.workspace = true

[dependencies]
gitquarry-core = { workspace = true }
gitquarry-forge-clients = { workspace = true }
gitquarry-i18n = { workspace = true }
s3db = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }
tracing = { workspace = true }

[dev-dependencies]
gitquarry-test-support = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
