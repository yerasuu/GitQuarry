[package]
name = "gitquarry-auth-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Self-contained auth primitives (password hashing, TOTP, OIDC client discovery) with no dependency on gitquarry-core"
license.workspace = true

[dependencies]
anyhow = { workspace = true }
argon2 = { version = "0.5.3", features = ["std"] }
data-encoding = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
sha1 = { workspace = true }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
openidconnect = { workspace = true }
# WebAuthn (src/webauthn.rs): CBOR for attestation objects and COSE keys,
# and the two signature algorithms passkeys use.
ciborium = { workspace = true }
p256 = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
url = "2.5.8"

[dev-dependencies]
gitquarry-test-support = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
