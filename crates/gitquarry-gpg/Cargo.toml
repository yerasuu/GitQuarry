[package]
name = "gitquarry-gpg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "OpenPGP key validation and detached-signature verification by shelling out to the system gpg binary"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["process", "fs"] }
tempfile = "3.27.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
