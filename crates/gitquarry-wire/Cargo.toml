[package]
name = "gitquarry-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Plain serde DTOs shared across gitquarry-core/gitquarry-federation process and peer-to-peer boundaries"
license.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rand = "0.10.2"
axum = "0.8.9"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
