[package]
name = "gitquarry-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Product-facing functionality (release CRUD, operator maintenance commands) that needs gitquarry-core's kernel but that the kernel never needs back"
license.workspace = true

[dependencies]
gitquarry-core = { workspace = true }
gitquarry-i18n = { workspace = true }
gitquarry-gpg = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }

[dev-dependencies]
gitquarry-test-support = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
