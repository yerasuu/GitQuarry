[package]
name = "gitquarry-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Product-facing functionality (release CRUD, operator maintenance commands) that needs gitquarry-core's kernel but that the kernel never needs back"
license.workspace = true

[dependencies]
gitquarry-core = { path = "../gitquarry-core" }
gitquarry-i18n = { path = "../gitquarry-i18n" }
gitquarry-gpg = { path = "../gitquarry-gpg" }
anyhow = "1.0.104"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs"] }
tracing = "0.1.44"

[dev-dependencies]
s3db = { git = "https://git.yerasuu.com/yerasuu/s3db", tag = "v0.4.6" }
s3db-crypto = { git = "https://git.yerasuu.com/yerasuu/s3db", tag = "v0.4.6" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
