[package]
name = "gitquarry-federation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Cross-instance federation for gitquarry: peer discovery (gossip), remote browse/fork, PR-proxy, fine-grained tokens — talks to gitquarry-core only over loopback HTTP"
license.workspace = true

[dependencies]
gitquarry-wire = { workspace = true }
s3db = { workspace = true, features = ["streaming"] }
s3db-crypto = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
axum = { workspace = true }
# Outbound calls to a candidate peer's `/_api/instance` (link verification)
# and to gitquarry-core's own loopback `/_internal/*` API.
reqwest = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
dirs = { workspace = true }
subtle = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
gitquarry-test-support = { workspace = true }
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
