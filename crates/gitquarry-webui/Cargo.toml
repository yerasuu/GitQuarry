[package]
name = "gitquarry-webui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only web UI (plus settings/search/auth pages) for gitquarry-core"
license.workspace = true

[dependencies]
# Path, not `workspace = true`: edition 2024 rejects `default-features =
# false` on an inherited dependency whose workspace entry keeps defaults, and
# this crate's own `tracker` feature is what turns `gitquarry-core/tracker`
# back on (see [features] below).
gitquarry-core = { path = "../gitquarry-core", default-features = false }
gitquarry-i18n = { workspace = true }
gitquarry-auth-crypto = { workspace = true }
gitquarry-domain = { workspace = true }
gitquarry-mirror-external = { workspace = true }
gitquarry-wire = { workspace = true }

# Storage engine, direct dep for `s3db::RequestCache` (the per-request
# read cache `webui::request_cache_middleware` scopes).
s3db = { workspace = true, features = ["streaming"] }

tokio = { workspace = true, features = ["macros", "sync", "time"] }
futures = { workspace = true }

# Web server / UI
axum = { workspace = true, features = ["multipart"] }
# Response compression only (`CompressionLayer`) -- the rest of tower-http
# (tracing, CORS, ...) isn't needed, so no `full`/default features.
tower-http = { version = "0.7.1", default-features = false, features = ["compression-gzip", "compression-br", "compression-zstd"] }
maud = { version = "0.27.0", features = ["axum"] }
openidconnect = { workspace = true }
pulldown-cmark = "0.13.4"
# Outbound HTTP to gitquarry-federation's loopback API (peer browse
# lookups, MR-proxy).
reqwest = { workspace = true, features = ["query"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
# One field (`csrf`) out of a proxied form body that must still ride
# through to federation byte-for-byte -- see
# `webui::federation_proxy::proxied_csrf`. Already in the tree via `url`.
form_urlencoded = { workspace = true }

# General utilities
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
lru = "0.18.5"
sha2 = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }

[features]
default = ["tracker"]
# Issue tracker/board/milestones views — see
# docs/tracker-binary-split-concept.md. `gitquarry-tracker` is its own
# binary, never a dependency of this one — every read/write here goes
# through `ctx.tracker` (`webui::tracker_client`). Off in a minimal build
# that never wants these tabs even if `[tracker]` were configured.
tracker = ["gitquarry-core/tracker"]

[dev-dependencies]
gitquarry-test-support = { workspace = true }
# Captures `webui::bootstrap::print_hint`'s log line, the only public way to
# learn the bootstrap token -- same version `gitquarry-server` installs.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
# Only for the issues/board/milestones tests: a real `gitquarry-tracker`
# server (its own `web::router` + `TrackerState`) bound to 127.0.0.1:0,
# exercised over the loopback exactly like a real deploy would. Never a
# production dependency (see [dependencies] above).
gitquarry-tracker = { path = "../gitquarry-tracker" }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
