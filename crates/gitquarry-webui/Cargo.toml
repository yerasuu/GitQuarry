[package]
name = "gitquarry-webui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only web UI (plus settings/search/auth pages) for gitquarry-core"
license.workspace = true

[dependencies]
# `default-features = false`: this crate's own `tracker` feature is what
# turns `gitquarry-core/tracker` back on (see [features] below) — without
# this, gitquarry-core's default features would always enable it
# regardless of whether this crate's own `tracker` feature is on.
gitquarry-core = { path = "../gitquarry-core", default-features = false }
gitquarry-i18n = { path = "../gitquarry-i18n" }
gitquarry-auth-crypto = { path = "../gitquarry-auth-crypto" }
gitquarry-domain = { path = "../gitquarry-domain" }
gitquarry-mirror-external = { path = "../gitquarry-mirror-external" }
gitquarry-wire = { path = "../gitquarry-wire" }

# Storage engine, direct dep for `s3db::RequestCache` (the per-request
# read cache `webui::request_cache_middleware` scopes) -- see
# gitquarry-core/Cargo.toml for why this is a git dependency pinned by tag.
s3db = { git = "https://git.yerasuu.com/yerasuu/s3db", tag = "v0.4.6", features = ["streaming"] }

tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
futures = "0.3.33"

# Web server / UI
axum = { version = "0.8.9", features = ["multipart"] }
# Response compression only (`CompressionLayer`) -- the rest of tower-http
# (tracing, CORS, ...) isn't needed, so no `full`/default features.
tower-http = { version = "0.6.9", default-features = false, features = ["compression-gzip", "compression-br", "compression-zstd"] }
maud = { version = "0.27.0", features = ["axum"] }
openidconnect = { version = "4.0.1", features = ["reqwest"] }
pulldown-cmark = "0.13.4"
# Outbound HTTP to gitquarry-federation's loopback API (peer browse
# lookups, MR-proxy) -- rustls-only, matches gitquarry-core's own pin.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# One field (`csrf`) out of a proxied form body that must still ride
# through to federation byte-for-byte -- see
# `webui::federation_proxy::proxied_csrf`. Already in the tree via `url`.
form_urlencoded = "1.2.2"

# General utilities
anyhow = "1.0.104"
# CSPRNG for the first-boot bootstrap token -- see `webui::bootstrap`.
rand = "0.10.2"
async-trait = "0.1.91"
base64 = "0.23.1"
lru = "0.18.2"
sha2 = "0.11.0"
tempfile = "3.27.0"
tracing = "0.1.44"

[features]
default = ["tracker"]
# Un-gates this crate's own #[cfg(test)] items for its tests/*.rs — see
# gitquarry-core's Cargo.toml for why plain #[cfg(test)] isn't enough
# across the crate boundary that external integration tests are.
test-util = []
# Issue tracker/board/milestones views — see
# docs/tracker-binary-split-concept.md. `gitquarry-tracker` is its own
# binary now, never a dependency of this one — every read/write here goes
# through `ctx.tracker` (`webui::tracker_client`). Off in a minimal build
# that never wants these tabs even if `[tracker]` were configured.
tracker = ["gitquarry-core/tracker"]

[dev-dependencies]
# `test-util` un-gates gitquarry-core's storage::local/crypto::SALT_LEN
# test-fixture helpers for this crate's own tests — see that crate's
# Cargo.toml for why plain `#[cfg(test)]` isn't enough across a crate
# boundary. `default-features = false` here too, same reasoning as the
# `[dependencies]` edge above — otherwise `cargo test --no-default-features
# --features test-util` couldn't actually turn `tracker` off.
gitquarry-core = { path = "../gitquarry-core", default-features = false, features = [
    "test-util",
] }
# Self-dependency so `cargo test` enables this crate's own `test-util`
# automatically for its tests/*.rs.
gitquarry-webui = { path = ".", default-features = false, features = ["test-util"] }
# Only for the issues/board/milestones tests: a real `gitquarry-tracker`
# server (its own `web::router` + `TrackerState`) bound to 127.0.0.1:0,
# exercised over the loopback exactly like a real deploy would — not a
# hand-rolled fake, since tracker's own web layer is cheap to stand up
# directly. Never a production dependency (see [dependencies] above).
gitquarry-tracker = { path = "../gitquarry-tracker" }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
