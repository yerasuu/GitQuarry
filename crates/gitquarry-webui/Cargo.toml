[package]
name = "gitquarry-webui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only web UI (plus settings/search/auth pages) for gitquarry-core"
license.workspace = true

[dependencies]
gitquarry-core = { path = "../gitquarry-core" }
gitquarry-i18n = { path = "../gitquarry-i18n" }
gitquarry-auth-crypto = { path = "../gitquarry-auth-crypto" }
gitquarry-domain = { path = "../gitquarry-domain" }
gitquarry-mirror-external = { path = "../gitquarry-mirror-external" }
gitquarry-wire = { path = "../gitquarry-wire" }

# Storage engine, direct dep for `s3db::RequestCache` (the per-request
# read cache `webui::request_cache_middleware` scopes) -- see
# gitquarry-core/Cargo.toml for why this is a git dependency pinned by tag.
s3db = { git = "https://git.yerasuu.com/yerasuu/s3db", tag = "v0.4.6", features = ["streaming"] }

tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
futures = "0.3.33"

# Web server / UI
axum = { version = "0.8.9", features = ["multipart"] }
# Response compression only (`CompressionLayer`) -- the rest of tower-http
# (tracing, CORS, ...) isn't needed, so no `full`/default features.
tower-http = { version = "0.6.9", default-features = false, features = ["compression-gzip", "compression-br", "compression-zstd"] }
maud = { version = "0.27.0", features = ["axum"] }
openidconnect = { version = "4.0.1", features = ["reqwest"] }
pulldown-cmark = "0.13.4"
# Outbound HTTP to gitquarry-federation's loopback API (peer browse
# lookups, MR-proxy) -- rustls-only, matches gitquarry-core's own pin.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# One field (`csrf`) out of a proxied form body that must still ride
# through to federation byte-for-byte -- see
# `webui::federation_proxy::proxied_csrf`. Already in the tree via `url`.
form_urlencoded = "1.2.2"

# General utilities
anyhow = "1.0.104"
# CSPRNG for the first-boot bootstrap token -- see `webui::bootstrap`.
rand = "0.10.2"
async-trait = "0.1.91"
base64 = "0.23.1"
lru = "0.18.2"
sha2 = "0.11.0"
tempfile = "3.27.0"
tracing = "0.1.44"

[dev-dependencies]
gitquarry-test-support = { path = "../gitquarry-test-support" }
# Captures `webui::bootstrap::print_hint`'s log line, the only public way to
# learn the bootstrap token -- same version `gitquarry-server` installs.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
