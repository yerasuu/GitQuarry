[package]
name = "gitquarry-tracker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Issue tracker + kanban board + milestones for gitquarry — its own optional binary, talks to gitquarry-core only over loopback HTTP (docs/tracker-binary-split-concept.md)"
license.workspace = true

[dependencies]
gitquarry-wire = { workspace = true }
gitquarry-i18n = { workspace = true }

s3db = { workspace = true, features = ["streaming"] }
s3db-crypto = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "fs"] }
axum = { workspace = true }
# Outbound calls to gitquarry-core's own loopback `/_internal/*` API.
reqwest = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
