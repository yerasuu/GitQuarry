[package]
name = "gitquarry-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Git remote backed by S3: domain/storage/auth/git/ssh/git-smart-HTTP core, consumed by the gitquarry binary"
license.workspace = true

[dependencies]
# Async runtime
futures = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "fs", "net", "signal", "sync", "time"] }

# Database over S3-compatible storage (backends, encryption at rest, CAS).
s3db = { workspace = true, features = ["streaming"] }
s3db-crypto = { workspace = true }

# Plain DTOs shared with the gitquarry-federation binary
gitquarry-wire = { workspace = true }

# git-smart-HTTP
axum = { workspace = true, features = ["multipart"] }
# Outbound HTTP for federation's peer round-trip (src/federation.rs).
reqwest = { workspace = true }

# git/ssh
russh = "0.63.3"

# Crypto (encryption-at-rest lives in s3db; password/TOTP/OIDC live in
# gitquarry-auth-crypto)
rand = { workspace = true }
sha2 = { workspace = true }

# dyn-dispatch for MirrorSyncHook (mirror/mod.rs) -- gitquarry-server wires
# gitquarry-mirror-external's real implementation in at startup, since core
# can't depend on that crate directly without a cycle.
async-trait = { workspace = true }

# Serialization / config
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# General utilities
anyhow = { workspace = true }
base64 = { workspace = true }
bytes = "1.12.1"
# Tells a request body over its size cap (413) apart from other read failures.
http-body-util = "0.1.5"
dirs = { workspace = true }
tempfile = { workspace = true }
gitquarry-gpg = { workspace = true }
gitquarry-i18n = { workspace = true }
gitquarry-forge-clients = { workspace = true }
gitquarry-auth-crypto = { workspace = true }

# Release source-archive generation: one `git archive --format=tar` decode,
# re-emitted as both .tar.gz and .zip in-process (see git::browse::archive_pair)
# instead of decoding the tree from git twice.
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tracing = { workspace = true }

[dev-dependencies]
gitquarry-test-support = { workspace = true }
# tests/auth_domain_user_totp.rs derives TOTP codes on its own, independent
# of gitquarry-auth-crypto (a real dependency that owns this in production).
data-encoding = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
