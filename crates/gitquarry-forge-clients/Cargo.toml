[package]
name = "gitquarry-forge-clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ForgeApi trait plus thin REST adapters for GitHub/GitLab/Codeberg, used by gitquarry-core's external-mirror MR sync"
license.workspace = true

[dependencies]
async-trait = "0.1.91"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
