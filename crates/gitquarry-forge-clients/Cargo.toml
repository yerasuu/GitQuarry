[package]
name = "gitquarry-forge-clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ForgeApi trait plus thin REST adapters for GitHub/GitLab/Codeberg, used by gitquarry-core's external-mirror MR sync"
license.workspace = true

[dependencies]
async-trait = "0.1.91"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }

[features]
# Un-gates otherwise-private items for this crate's own tests/*.rs — same
# reasoning gitquarry-core's own `test-util` feature has.
test-util = []

[dev-dependencies]
gitquarry-forge-clients = { path = ".", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
